databases:
  - name: monitor-db
    plan: free

services:
  - type: web
    name: monitor-api
    runtime: docker
    plan: free
    rootDir: api
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: monitor-db
          property: connectionString
      - key: CORS_ORIGINS
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_MODEL
        value: gpt-4o-mini
